name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, id: windows-x64, runner: windows-latest }
          - { name: macOS Apple silicon, id: macos-arm64, runner: macos-latest }
          - { name: macOS Intel, id: macos-x64, runner: macos-15-intel }
          # The oldest supported Ubuntu, so the app runs on as many distributions as possible.
          - { name: Linux x64, id: linux-x64, runner: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.id }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf build-essential nasm meson ninja-build pkg-config zlib1g-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkgconf

      # Windows downloads a ready FFmpeg in the build itself (scripts/fetch-ffmpeg.ts); keep it between runs.
      - name: Cache FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.id }}-${{ hashFiles('scripts/fetch-ffmpeg.ts') }}

      # macOS and Linux build their own, with the whisper filter automatic captions need. It takes a while, so it's cached.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ffmpeg-build/ffmpeg
          key: ffmpeg-${{ matrix.id }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          WORK: ${{ runner.temp }}/ffmpeg-work
        run: bash scripts/build-ffmpeg.sh ffmpeg-build/ffmpeg

      - name: Place FFmpeg next to the app
        if: runner.os != 'Windows'
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp ffmpeg-build/ffmpeg "src-tauri/binaries/ffmpeg-$triple"
          chmod +x "src-tauri/binaries/ffmpeg-$triple"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        run: |
          args=()
          # A tag like v1.2.3 sets the version the installers carry.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            args=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\"}")
          fi
          bun run tauri build "${args[@]}"

      - name: Collect installers
        run: |
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          files=("$bundle"/nsis/*.exe "$bundle"/msi/*.msi "$bundle"/dmg/*.dmg "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were built." >&2
            exit 1
          fi
          mkdir -p out
          cp "${files[@]}" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.id }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  checksum:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: slate-*
          merge-multiple: true
          path: release

      - name: Write checksum.txt
        working-directory: release
        run: |
          sha256sum -- * > checksum.txt
          cat checksum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slate
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            flags=(--title "Slate $tag" --generate-notes --verify-tag)
            [[ $tag == *-* ]] && flags+=(--prerelease)
            gh release create "$tag" release/* "${flags[@]}"
          fi