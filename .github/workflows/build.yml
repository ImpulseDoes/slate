name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(join(github.event.commits.*.message, ' '), '--build') ||
      contains(github.event.pull_request.title, '--build')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag like v1.2.3 names the version. Otherwise it's major.minor from tauri.conf.json and the
      # commit count, which never repeats on main and stays the same when a run is repeated.
      - id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(jq -r .version src-tauri/tauri.conf.json)
            version=${base%.*}.$(git rev-list --count HEAD)
          fi
          publish=false
          if [[ $GITHUB_REF == refs/tags/v* || $GITHUB_REF == refs/heads/main ]]; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish: $publish"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, id: windows-x64, runner: windows-latest }
          - { name: macOS Apple silicon, id: macos-arm64, runner: macos-latest }
          - { name: macOS Intel, id: macos-x64, runner: macos-15-intel }
          # The oldest supported Ubuntu, so the app runs on as many distributions as possible.
          - { name: Linux x64, id: linux-x64, runner: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.id }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf build-essential nasm meson ninja-build pkg-config zlib1g-dev autoconf automake libtool

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkgconf autoconf automake libtool

      # Windows downloads a ready FFmpeg in the build itself (scripts/fetch-ffmpeg.ts); keep it between runs.
      - name: Cache FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.id }}-${{ hashFiles('scripts/fetch-ffmpeg.ts') }}

      # macOS and Linux build their own, with the whisper filter automatic captions need. It takes a while, so it's cached.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ffmpeg-build/ffmpeg
          key: ffmpeg-${{ matrix.id }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          WORK: ${{ runner.temp }}/ffmpeg-work
        run: bash scripts/build-ffmpeg.sh ffmpeg-build/ffmpeg

      - name: Place FFmpeg next to the app
        if: runner.os != 'Windows'
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp ffmpeg-build/ffmpeg "src-tauri/binaries/ffmpeg-$triple"
          chmod +x "src-tauri/binaries/ffmpeg-$triple"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repo keeps only icon.ico; macOS and Linux bundles need PNG and ICNS, made here from its largest picture.
      - name: Make the macOS and Linux icons
        if: runner.os != 'Windows'
        run: |
          bun -e '
            const fs = require("fs")
            const ico = fs.readFileSync("src-tauri/icons/icon.ico")
            let best
            for (let i = 0; i < ico.readUInt16LE(4); i++) {
              const at = 6 + i * 16
              const size = ico[at] || 256
              if (!best || size > best.size) best = { size, length: ico.readUInt32LE(at + 8), offset: ico.readUInt32LE(at + 12) }
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/icon.png", ico.subarray(best.offset, best.offset + best.length))
          '
          bun run tauri icon "$RUNNER_TEMP/icon.png" -o "$RUNNER_TEMP/icons"
          for file in "$RUNNER_TEMP"/icons/*.png "$RUNNER_TEMP"/icons/*.icns; do
            [ -e "src-tauri/icons/$(basename "$file")" ] || cp "$file" src-tauri/icons/
          done
          ls src-tauri/icons

      - name: Build the app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
            const fs = require("fs")
            const file = "src-tauri/tauri.conf.json"
            const config = JSON.parse(fs.readFileSync(file, "utf8"))
            config.version = process.env.VERSION
            fs.writeFileSync(file, JSON.stringify(config, null, 2))
          '
          bun run tauri build

      - name: Collect installers
        run: |
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          files=("$bundle"/nsis/*.exe "$bundle"/msi/*.msi "$bundle"/dmg/*.dmg "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were built." >&2
            exit 1
          fi
          mkdir -p out
          cp "${files[@]}" out/
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: slate-${{ matrix.id }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # Runs only when every platform built, so a release is never missing an installer.
  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: slate-*
          merge-multiple: true
          path: release

      - name: Write checksum.txt
        working-directory: release
        run: |
          sha256sum -- * > checksum.txt
          cat checksum.txt

      # Builds that aren't released, like pull requests, stay downloadable from the run.
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.publish != 'true'
        with:
          name: slate
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: List the commits
        if: needs.version.outputs.publish == 'true'
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: bash scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > notes.md

      - name: Publish the release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            flags=(--title "Slate $TAG" --notes-file notes.md --target "$GITHUB_SHA")
            [[ $TAG == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" release/* "${flags[@]}"
          fi